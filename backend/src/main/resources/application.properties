spring.application.name=shiftbalance
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
spring.config.import=optional:file:./backend/.env.local[.properties],optional:file:./.env.local[.properties]
spring.datasource.url=${SHIFTBALANCE_DB_URL}
spring.datasource.username=${SHIFTBALANCE_DB_USER}
spring.datasource.password=${SHIFTBALANCE_DB_PASSWORD}
shiftbalance.bootstrap-admin.username=${SHIFTBALANCE_ADMIN_USERNAME:}
shiftbalance.bootstrap-admin.password=${SHIFTBALANCE_ADMIN_PASSWORD:}
shiftbalance.bootstrap-admin.display-name=${SHIFTBALANCE_ADMIN_DISPLAY_NAME:}
shiftbalance.cors.allowed-origins=${SHIFTBALANCE_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SHIFTBALANCE_SESSION_COOKIE_SECURE:false}
knife4j.enable=true
knife4j.setting.language=zh_cn
