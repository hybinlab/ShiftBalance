server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass $backend;
    }

    location = /api {
        proxy_pass $backend;
    }

    location = /doc.html { proxy_pass $backend; }
    location = /swagger-ui.html { proxy_pass $backend; }
    location /swagger-ui/ { proxy_pass $backend; }
    location /swagger-resources { proxy_pass $backend; }
    location /webjars/ { proxy_pass $backend; }
    location /v3/api-docs { proxy_pass $backend; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
