name: Windows desktop installer
on:
  push:
    branches: [feat/windows-desktop]
    paths: ['desktop/**', 'backend/**', 'frontend/**', '.github/workflows/windows-desktop.yml']
  workflow_dispatch:
    inputs:
      postgres_url:
        description: Official EDB Windows x64 PostgreSQL binary ZIP URL (use the same major version for updates)
        type: string
        required: false
      postgres_sha256:
        description: SHA256 of the reviewed PostgreSQL ZIP
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Build and verify offline Windows installer
        shell: pwsh
        env:
          POSTGRES_URL: ${{ inputs.postgres_url }}
          POSTGRES_SHA256: ${{ inputs.postgres_sha256 }}
        run: |
          $lock = Get-Content desktop/runtime-lock.json -Raw | ConvertFrom-Json
          $url = if ($env:POSTGRES_URL) { $env:POSTGRES_URL } else { $lock.postgresUrl }
          $checksum = if ($env:POSTGRES_SHA256) { $env:POSTGRES_SHA256 } else { $lock.postgresSha256 }
          $uri = [Uri]$url
          if ($uri.Scheme -ne 'https' -or $uri.Host -ne 'get.enterprisedb.com' -or $uri.AbsolutePath -notmatch 'windows-x64-binaries\.zip$') {
            throw 'Use the official EDB Windows x64 binary archive URL.'
          }
          New-Item -ItemType Directory -Force desktop/build | Out-Null
          Invoke-WebRequest $uri -OutFile desktop/build/postgresql.zip
          ./desktop/build-windows.ps1 -PostgresZip desktop/build/postgresql.zip -PostgresSha256 $checksum
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ShiftBalance-Windows-x64
          path: desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-desktop-test-logs
          path: |
            backend/target/desktop-self-check-*/**/*.log
          retention-days: 7
