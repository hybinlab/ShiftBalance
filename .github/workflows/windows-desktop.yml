name: Windows desktop installer
on:
  push:
    branches: [feat/windows-desktop]
    paths: ['desktop/**', 'backend/**', 'frontend/**', '.github/workflows/windows-desktop.yml']
  workflow_dispatch:
    inputs:
      installer_run_id:
        description: Re-test an existing installer artifact without rebuilding (leave empty for a full build)
        type: string
        required: false
      postgres_url:
        description: Official EDB Windows x64 PostgreSQL binary ZIP URL (use the same major version for updates)
        type: string
        required: false
      postgres_sha256:
        description: SHA256 of the reviewed PostgreSQL ZIP
        type: string
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        if: ${{ !inputs.installer_run_id }}
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !inputs.installer_run_id }}
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        if: ${{ !inputs.installer_run_id }}
        with:
          workspaces: desktop/src-tauri -> target
          cache-on-failure: true
      - name: Prepare runtime and verify Windows database / solver
        if: ${{ !inputs.installer_run_id }}
        shell: pwsh
        env:
          POSTGRES_URL: ${{ inputs.postgres_url }}
          POSTGRES_SHA256: ${{ inputs.postgres_sha256 }}
        run: |
          $lock = Get-Content desktop/runtime-lock.json -Raw | ConvertFrom-Json
          $url = if ($env:POSTGRES_URL) { $env:POSTGRES_URL } else { $lock.postgresUrl }
          $checksum = if ($env:POSTGRES_SHA256) { $env:POSTGRES_SHA256 } else { $lock.postgresSha256 }
          $uri = [Uri]$url
          if ($uri.Scheme -ne 'https' -or $uri.Host -ne 'get.enterprisedb.com' -or $uri.AbsolutePath -notmatch 'windows-x64-binaries\.zip$') {
            throw 'Use the official EDB Windows x64 binary archive URL.'
          }
          New-Item -ItemType Directory -Force desktop/build | Out-Null
          Invoke-WebRequest $uri -OutFile desktop/build/postgresql.zip
          ./desktop/build-windows.ps1 -PostgresZip desktop/build/postgresql.zip -PostgresSha256 $checksum -PrepareOnly
      - name: Build Tauri Windows installer
        if: ${{ !inputs.installer_run_id }}
        shell: pwsh
        working-directory: desktop
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Desktop npm install failed.' }
          npm run build:windows
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging failed.' }
      - uses: actions/download-artifact@v4
        if: ${{ inputs.installer_run_id }}
        with:
          name: ShiftBalance-Windows-x64
          run-id: ${{ inputs.installer_run_id }}
          github-token: ${{ github.token }}
          path: desktop/build/installer
      - name: Install bundle and offline WebView2 runtime
        shell: pwsh
        env:
          INSTALLER_RUN_ID: ${{ inputs.installer_run_id }}
        run: |
          $bundle = if ($env:INSTALLER_RUN_ID) { 'desktop/build/installer' } else { 'desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis' }
          $installer = Get-ChildItem "$bundle/*.exe" | Select-Object -First 1
          $destination = Join-Path $env:RUNNER_TEMP 'ShiftBalance-ui-test'
          $result = Start-Process $installer.FullName -ArgumentList '/S', "/D=$destination" -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Desktop installation failed: $($result.ExitCode)" }
          "SHIFTBALANCE_TEST_EXE=$destination/shiftbalance-desktop.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Apply current frontend to reused test bundle
        if: ${{ inputs.installer_run_id }}
        shell: pwsh
        run: |
          npm ci --prefix frontend
          if ($LASTEXITCODE -ne 0) { throw 'Frontend npm install failed.' }
          $env:VITE_DESKTOP = 'true'
          npm run build --prefix frontend
          if ($LASTEXITCODE -ne 0) { throw 'Desktop frontend build failed.' }
          $web = Join-Path $env:RUNNER_TEMP 'ShiftBalance-ui-test/payload/web'
          Remove-Item -Recurse -Force $web
          Copy-Item frontend/dist $web -Recurse
      - name: Check native Windows dropdowns
        shell: pwsh
        working-directory: desktop
        run: node scripts/check-windows-ui.mjs
      - name: Upload installer
        if: ${{ !inputs.installer_run_id }}
        uses: actions/upload-artifact@v4
        with:
          name: ShiftBalance-Windows-x64
          path: desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-desktop-test-logs
          path: |
            backend/target/desktop-self-check-*/**/*.log
            backend/target/desktop-ui-check/**/logs/*.log
            backend/target/desktop-ui-check/dropdown-failure.*
          retention-days: 7
