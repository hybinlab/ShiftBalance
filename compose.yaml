services:
  backend:
    build:
      context: ./backend
    environment:
      SHIFTBALANCE_DB_URL: ${SHIFTBALANCE_DB_URL:-jdbc:postgresql://192.168.31.5:5432/shiftbalance}
      SHIFTBALANCE_DB_USER: ${SHIFTBALANCE_DB_USER:-shiftbalance}
      SHIFTBALANCE_DB_PASSWORD: ${SHIFTBALANCE_DB_PASSWORD:?Set SHIFTBALANCE_DB_PASSWORD in .env}
      SHIFTBALANCE_ADMIN_USERNAME: ${SHIFTBALANCE_ADMIN_USERNAME:-}
      SHIFTBALANCE_ADMIN_PASSWORD: ${SHIFTBALANCE_ADMIN_PASSWORD:-}
      SHIFTBALANCE_ADMIN_DISPLAY_NAME: ${SHIFTBALANCE_ADMIN_DISPLAY_NAME:-排班管理员}
      SHIFTBALANCE_CORS_ALLOWED_ORIGINS: ${SHIFTBALANCE_CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      SHIFTBALANCE_SESSION_COOKIE_SECURE: ${SHIFTBALANCE_SESSION_COOKIE_SECURE:-false}
    expose:
      - "8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "${SHIFTBALANCE_HTTP_PORT:-8080}:80"
    restart: unless-stopped
